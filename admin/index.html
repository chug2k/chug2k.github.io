<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Write — Charles Lee</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./app.css">
<!-- app.js is a prebuilt esbuild bundle (see _scripts/build-admin.sh).
     No runtime CDN: everything the editor needs ships from this folder. -->
<script type="module" src="./app.js"></script>
<style>
  :root {
    --bg: #f5f1e8; --paper: #faf7f0; --ink: #1a1816;
    --muted: #6b655c; --rule: #d9d2c3; --accent: #cc5429;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Charter", "Georgia", serif; font-size: 18px; }
  .bar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px; background: var(--paper);
    border-bottom: 1px solid var(--rule);
    font-family: "Inter", -apple-system, sans-serif; font-size: 13px;
  }
  .bar a.home { color: var(--muted); text-decoration: none; }
  .bar a.home:hover { color: var(--accent); }
  .bar .spacer { flex: 1; }
  .bar .status { color: var(--muted); font-size: 12px; }
  .btn {
    font-family: inherit; font-size: 13px; font-weight: 600;
    border: 1px solid var(--rule); border-radius: 8px;
    background: var(--paper); color: var(--ink);
    padding: 7px 14px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .sheet { max-width: 720px; margin: 0 auto; padding: 48px 24px 120px; }
  #title {
    width: 100%; border: none; outline: none; resize: none; overflow: hidden;
    background: transparent; color: var(--ink);
    font-family: "Charter", "Georgia", serif;
    font-size: clamp(32px, 5.5vw, 46px); font-weight: 700; line-height: 1.12;
    padding: 0; margin: 0 0 8px;
  }
  #title::placeholder { color: #b9b0a1; }
  #dek {
    width: 100%; border: none; outline: none; resize: none; overflow: hidden;
    background: transparent; color: var(--muted);
    font-family: "Charter", "Georgia", serif; font-size: 20px; line-height: 1.45;
    padding: 0; margin: 0 0 6px;
  }
  #dek::placeholder { color: #c6bdaD; }
  .meta-row {
    display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center;
    font-family: "Inter", sans-serif; font-size: 12.5px; color: var(--muted);
    padding: 14px 0; margin-bottom: 8px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  }
  .meta-row input {
    font: inherit; color: var(--ink); background: transparent;
    border: none; border-bottom: 1px dashed var(--rule); outline: none;
    padding: 2px 4px; min-width: 0;
  }
  .meta-row input:focus { border-bottom-color: var(--accent); }
  #editor { min-height: 50vh; cursor: text; }
  #editor .bn-container { font-size: 18px; }
  .drawer {
    font-family: "Inter", sans-serif; font-size: 13px;
    max-width: 720px; margin: 0 auto; padding: 0 24px 40px;
  }
  .drawer details { border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); margin-bottom: 12px; }
  .drawer summary { cursor: pointer; padding: 12px 16px; color: var(--muted); }
  .drawer .body { padding: 0 16px 16px; }
  .drawer label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 12px; }
  .drawer input[type=text], .drawer input[type=password] {
    width: 100%; font: inherit; padding: 8px 10px; color: var(--ink);
    border: 1px solid var(--rule); border-radius: 8px; background: var(--bg);
  }
  .postlist { list-style: none; margin: 8px 0 0; padding: 0; }
  .postlist li { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--rule); }
  .postlist button.link { background: none; border: none; padding: 0; cursor: pointer;
    font: inherit; color: var(--ink); text-align: left; }
  .postlist button.link:hover { color: var(--accent); }
  .postlist .d { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #mdPreview { white-space: pre-wrap; font-size: 12px; background: var(--bg);
    border: 1px solid var(--rule); border-radius: 8px; padding: 12px; max-height: 300px; overflow: auto; }
  .hint { color: var(--muted); font-size: 12.5px; line-height: 1.6; }
  .hint code { font-size: 12px; }
</style>
</head>
<body>
<div class="bar">
  <a class="home" href="/">← site</a>
  <button class="btn" id="newBtn" type="button">New</button>
  <span class="status" id="status">loading editor…</span>
  <span class="spacer"></span>
  <span class="status" id="words"></span>
  <button class="btn primary" id="publishBtn" type="button" disabled>Publish</button>
</div>

<div class="sheet">
  <textarea id="title" rows="1" placeholder="Title"></textarea>
  <textarea id="dek" rows="1" placeholder="A one-line summary for cards and RSS…"></textarea>
  <div class="meta-row">
    <label>Date <input id="date" type="text" size="10" value=""></label>
    <label>Slug <input id="slug" type="text" size="28" placeholder="auto-from-title"></label>
  </div>
  <div id="editor"></div>
</div>

<div class="drawer">
  <details open>
    <summary>Posts &amp; settings</summary>
    <div class="body">
      <label>GitHub token (needs <code>contents:write</code> on this repo — stays in this browser)</label>
      <input type="password" id="token" placeholder="ghp_… / github_pat_…">
      <p class="hint">Owner / repo / branch default to this site. Publishing commits
      <code>blog/posts/YYYY-MM-DD-slug.md</code> — a GitHub Action renders the
      page, index, feed and sitemap within a minute or two.</p>
      <label>Owner</label><input type="text" id="owner" value="chug2k">
      <label>Repo</label><input type="text" id="repo" value="chug2k.github.io">
      <label>Branch</label><input type="text" id="branch" value="main">
      <label>Open an existing post</label>
      <ul class="postlist" id="postlist"><li class="d">needs a token to list posts</li></ul>
    </div>
  </details>
  <details>
    <summary>Markdown preview</summary>
    <div class="body"><pre id="mdPreview">(write something)</pre></div>
  </details>
</div>

</body>
</html>
