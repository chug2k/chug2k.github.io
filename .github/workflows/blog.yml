name: Render blog
on:
  push:
    branches: [main]
    paths: ["blog/posts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 _scripts/build-blog.py
      - run: python3 _scripts/build-sitemap.py
      - run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add blog/ feed.xml sitemap.xml
          git diff --cached --quiet && echo "nothing to render" && exit 0
          git commit -m "Render blog ($(date -u +%F))"
          # Another push may have landed while we worked — rebase, rebuild,
          # and only then push, so rapid successive publishes don't fail.
          git pull --rebase origin main
          python3 _scripts/build-blog.py
          python3 _scripts/build-sitemap.py
          git add blog/ feed.xml sitemap.xml
          git diff --cached --quiet || git commit -m "Render blog ($(date -u +%F))" --amend --no-edit
          git push
