name: Render blog
on:
  push:
    branches: [main]
    paths: ["blog/posts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 _scripts/build-blog.py
      - run: python3 _scripts/build-sitemap.py
      - run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add blog/ feed.xml sitemap.xml
          git diff --cached --quiet || git commit -m "Render blog ($(date -u +%F))"
          git push
